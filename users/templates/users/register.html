<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Account — TripBuddy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-light-subtle">
    <div class="container py-5">
      <div class="text-center mb-4">
        <a class="navbar-brand fw-bold text-primary" href="../index.html"
          >TripBuddy</a
        >
      </div>
      {% if messages %} {% for message in messages %}
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      {% endfor %} {% endif %}
      <form
        method="POST"
        action="{% url 'register' %}"
        enctype="multipart/form-data"
      >
        {% csrf_token %}
        <div class="form-card mx-auto" style="max-width: 600px">
          <h2 class="fw-bold">Create your account</h2>
          <p class="text-muted">Join travelers and hosts on TripMate.</p>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">First name</label
              ><input class="form-control" name="first_name" value="" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Last name</label
              ><input class="form-control" name="last_name" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Username</label
              ><input class="form-control" name="username" />
            </div>
            <div class="col-6">
              <label class="form-label">Email</label
              ><input type="email" class="form-control" name="email" />
            </div>
            <div class="col-12">
              <label class="form-label">Password</label
              ><input type="password" class="form-control" name="password" />
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100">
                Create account
              </button>
            </div>
          </div>
          <p class="text-center mt-4 mb-0">
            Already registered? <a href="{% url 'login' %}">Login</a>
          </p>
        </div>
      </form>
    </div>
  </body>
</html>
